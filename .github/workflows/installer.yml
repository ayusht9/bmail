name: Build manual Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    env:
      BMAIL_DROPBOX_APP_KEY: ${{ secrets.BMAIL_DROPBOX_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: Bmail-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
