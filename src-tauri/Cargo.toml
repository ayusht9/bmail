[package]
name = "mail-vault"
version = "0.1.0"
description = "A local, read-only Zoho mail backup dashboard"
authors = ["Mail Vault"]
edition = "2021"

[lib]
name = "mail_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

