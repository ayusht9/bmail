[package]
name = "bmail"
version = "0.3.0"
description = "A local, read-only email backup dashboard for Gmail and Zoho"
authors = ["Bmail"]
edition = "2021"

[lib]
name = "bmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

